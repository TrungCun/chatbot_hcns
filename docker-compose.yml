version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: chatbot-hcns-redis
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-storage:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: chatbot-hcns-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
    restart: unless-stopped

  chatbot-app:
    build: .
    container_name: chatbot-hcns-app
    ports:
      - "9070:9070"
      - "9080:9080"
    environment:
      - DB_HOST=10.0.10.87
      - DB_PORT=3306
      - DB_USER=aipt
      - DB_PASSWORD=aipt2023
      - DB_NAME=training
      - TIME_ZONE=Asia/Ho_Chi_Minh
      - REDIS_HOST=redis
      - QDRANT_HOST=qdrant
    depends_on:
      - redis
      - qdrant
    volumes:
      - .:/app
    restart: unless-stopped

volumes:
  redis-storage:
    driver: local
  qdrant-storage:
    driver: local