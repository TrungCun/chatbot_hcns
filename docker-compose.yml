version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: chatbot-hcns-redis
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-storage:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: chatbot-hcns-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: chatbot-hcns-n8n
    ports:
      - "9050:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      - TZ=Asia/Ho_Chi_Minh
      - N8N_HOST=10.0.99.116
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=https://chatbot-tuyendung.aipt.vn/
      - N8N_EDITOR_BASE_URL=http://10.0.99.116:9050/
      - N8N_SECURE_COOKIE=false
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
    volumes:
      - n8n-storage:/home/node/.n8n
    restart: unless-stopped

volumes:
  redis-storage:
    driver: local
  qdrant-storage:
    driver: local
  n8n-storage:
    driver: local